# SAC training configuration
# Used by: rl/train.py

training:
  n_envs: 8                    # Parallel environments
  max_episode_steps: 300

  # SAC hyperparams
  learning_rate: 3.0e-4
  buffer_size: 500000
  learning_starts: 10000
  batch_size: 512
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto

  # Scale
  total_timesteps: 2000000

  # Logging
  log_dir: "logs/sac_peg_in_hole"
  save_dir: "results/sac_peg_in_hole"
  save_freq: 50000
  eval_freq: 20000
  n_eval_episodes: 10

  # Network
  features_dim: 128
  net_arch:
    pi: [256, 256]
    qf: [256, 256]
